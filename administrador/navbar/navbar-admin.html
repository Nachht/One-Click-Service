<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/navbar-admin.css">
</head>
<body>

<header>
    <nav class="navbar-kumo">
        <div class="container-kumo">
            <!-- FILA SUPERIOR -->
            <div class="nav-top">
                <!-- LOGO -->
                <a href="../../inicio/index.html" class="logo-link">
                    <img src="../../assets/img/logo.png" alt="KUMO" class="logo-img">
                </a>

                <!-- ÍCONOS -->
                <div class="nav-icons">
                    <!-- Menú de usuario (se genera con JS) -->
                    <div class="user-menu-container" id="adminUserMenu"></div>

                    <!-- Volver a la tienda -->
                    <a href="../../inicio/index.html" class="icon-link" title="Volver a la tienda">
                        <i class="bi bi-shop"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/admin-navbar.js"></script>
</body>
</html>
