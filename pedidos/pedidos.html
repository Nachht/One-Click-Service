<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Pedidos | Kumo</title>

    <link rel="stylesheet" href="../estilos-css/pedidos.css">
    <link rel="stylesheet" href="../estilos-css/carrito.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="../assets/img/logo.png">
</head>

<body>
    <script src="../js/navbar.js"></script>

    <main class="container py-5" style="max-width: 1100px;">
        <!-- ENCABEZADO -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="titulo-pedidos">MIS PEDIDOS</h1>
                <p class="text-muted">Historial de todas tus compras en Kumo</p>
            </div>
            <a href="../catalogo/catalogo.html" class="btn btn-gradient-kumo px-4 py-2 rounded-pill shadow-sm">
                <i class="bi bi-arrow-left me-1"></i> Seguir comprando
            </a>
        </div>

        <!-- FILTROS -->
        <div class="filtros-pedidos mb-4">
            <button class="btn-filtro activo" data-filtro="todos">Todos</button>
            <button class="btn-filtro" data-filtro="pendiente">Pendientes</button>
            <button class="btn-filtro" data-filtro="enviado">Enviados</button>
            <button class="btn-filtro" data-filtro="entregado">Entregados</button>
            <button class="btn-filtro" data-filtro="cancelado">Cancelados</button>
        </div>

        <!-- CONTENEDOR DE PEDIDOS -->
        <div id="contenedorPedidos" class="d-flex flex-column gap-4">
            <!-- JS inyectará los pedidos aquí -->
        </div>

        <!-- MENSAJE DE CARGANDO -->
        <div id="cargandoPedidos" class="text-center py-5" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-3 text-muted">Cargando tus pedidos...</p>
        </div>

        <!-- MENSAJE DE SIN PEDIDOS -->
        <div id="sinPedidos" class="text-center py-5" style="display: none;">
            <i class="bi bi-box-seam" style="font-size: 4rem; color: #D1D5DB;"></i>
            <h4 class="mt-3 text-muted">No tienes pedidos aún</h4>
            <p class="text-muted">Explora nuestro catálogo y realiza tu primera compra.</p>
            <a href="../catalogo/catalogo.html" class="btn btn-gradient-kumo px-4 py-2 rounded-pill">
                Ir al catálogo
            </a>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/auth-service.js"></script>
    <script src="../js/pedidos.js"></script>
    <script src="../js/footer.js"></script>
</body>

</html>
