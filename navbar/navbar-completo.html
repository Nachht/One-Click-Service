<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbaro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos-css/navbar.css">
</head>

<body>

    <!-- HEADER con NAVBAR (armonizado) -->
    <header>
        <nav class="navbar-kumo">
            <div class="container-kumo">

                <!-- FILA SUPERIOR -->
                <div class="nav-top">

                    <!-- LOGO -->
                    <a href="../inicio/index.html" class="logo-link">
                        <img src="../assets/img/logo.png" alt="KUMO" class="logo-img">
                        <!-- <span class="logo-text">KUMO</span> -->
                    </a>

                    <!-- BUSCADOR -->
                    <div class="search-wrapper">
                        <i class="bi bi-search" id="searchIcon"></i>
                        <input type="text" id="searchInputNav" placeholder="Buscar productos...">
                    </div>

                    <!-- ÍCONOS -->
                    <div class="nav-icons">
                        <a href="../perfil/perfil.html" class="icon-link">
                            <i class="bi bi-person"></i>
                            <span>Cuenta</span>
                        </a>
                        <button class="icon-link btn-cart-offcanvas" type="button" data-bs-toggle="offcanvas"
                            data-bs-target="#carritoKumo" aria-controls="carritoKumo"
                            style="background: none; border: none; padding: 0; color: inherit; cursor: pointer;">
                            <i class="bi bi-cart3"></i>

                        </button>
                        <!-- Hamburguesa (móvil) -->
                        <button class="hamburger" id="hamburgerBtn">
                            <i class="bi bi-list"></i>
                        </button>
                    </div>

                </div>

                <!-- FILA INFERIOR (menú) -->
                <div class="nav-bottom" id="navMenu">
                    <a href="../inicio/index.html" class="menu-link active">INICIO</a>
                    <a href="../catalogo/catalogo.html" class="menu-link">CATÁLOGO</a>
                    <a href="../nosotros/nosotros.html" class="menu-link">NOSOTROS</a>
                    <a href="../contactenos/contactenos.html" class="menu-link">CONTACTO</a>
                </div>

            </div>
        </nav>
    </header>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
</body>

</html>
