<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil | Kumo</title>

    <link rel="stylesheet" href="../estilos-css/perfil.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="../assets/img/logo.png">
</head>

<body>
    <script src="../js/navbar.js"></script>

    <main class="container py-5" style="max-width: 900px;">
        <div class="row g-4">
            <!-- Panel izquierdo - Información del usuario -->
            <div class="col-lg-4">
                <div class="card perfil-card shadow-sm border-0">
                    <div class="card-body text-center">
                        <div class="avatar-container mb-3">
                            <div class="avatar-circle">
                                <i class="bi bi-person-fill"></i>
                            </div>
                        </div>
                        <h4 id="perfilNombre" class="fw-bold mb-1">Usuario</h4>
                        <p id="perfilEmail" class="text-muted small">usuario@email.com</p>
                        <span id="perfilRol" class="badge bg-primary">Cliente</span>
                        <hr>
                
                    </div>
                </div>
            </div>

            <!-- Panel derecho - Formularios -->
            <div class="col-lg-8">
                <!-- Sección de datos personales -->
                <div class="card perfil-card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white border-0">
                        <h5 class="fw-bold mb-0"><i class="bi bi-pencil-square me-2 text-fucsia"></i>Editar perfil</h5>
                    </div>
                    <div class="card-body">
                        <form id="formularioPerfil">
                            
                            <div class="mb-3">
                                <label for="inputTelefono" class="form-label fw-bold">Teléfono</label>
                                <input type="text" class="form-control" id="inputTelefono" placeholder="Ej: 3001234567">
                            </div>
                            
                            <button type="submit" class="btn btn-gradient-kumo text-white px-4 py-2 rounded-pill">
                                <i class="bi bi-save me-1"></i> Guardar cambios
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Sección de cambio de contraseña -->
                <div class="card perfil-card shadow-sm border-0">
                    <div class="card-header bg-white border-0">
                        <h5 class="fw-bold mb-0"><i class="bi bi-key me-2 text-fucsia"></i>Cambiar contraseña</h5>
                    </div>
                    <div class="card-body">
                        <form id="formularioPassword">
                            <div class="mb-3">
                                <label for="inputPasswordActual" class="form-label fw-bold">Contraseña actual</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="inputPasswordActual" placeholder="Ingresa tu contraseña actual">
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('inputPasswordActual')">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="inputPasswordNueva" class="form-label fw-bold">Nueva contraseña</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="inputPasswordNueva" placeholder="Nueva contraseña (mínimo 6 caracteres)">
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('inputPasswordNueva')">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="inputPasswordConfirmar" class="form-label fw-bold">Confirmar nueva contraseña</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="inputPasswordConfirmar" placeholder="Confirma tu nueva contraseña">
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('inputPasswordConfirmar')">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-gradient-kumo text-white px-4 py-2 rounded-pill">
                                <i class="bi bi-key me-1"></i> Cambiar contraseña
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Sección de administración de usuarios (solo admin) -->
                <div id="seccionAdminUsuarios" class="card perfil-card shadow-sm border-0 mt-4" style="display: none;">
                    <div class="card-header bg-white border-0">
                        <h5 class="fw-bold mb-0"><i class="bi bi-people me-2 text-fucsia"></i>Administrar usuarios</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="selectUsuarioAdmin" class="form-label fw-bold">Seleccionar usuario</label>
                            <select class="form-select" id="selectUsuarioAdmin">
                                <option value="">Cargando usuarios...</option>
                            </select>
                        </div>
                        <div id="datosUsuarioAdmin" style="display: none;">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Nombre</label>
                                    <input type="text" class="form-control" id="adminNombre" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Email</label>
                                    <input type="text" class="form-control" id="adminEmail" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Rol</label>
                                    <select class="form-select" id="adminRol">
                                        <option value="CLIENTE">Cliente</option>
                                        <option value="ADMIN">Administrador</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Estado</label>
                                    <select class="form-select" id="adminEstado">
                                        <option value="true">Activo</option>
                                        <option value="false">Inactivo</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mt-3">
                                <label class="form-label fw-bold">Cambiar contraseña</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="adminPassword" placeholder="Nueva contraseña (dejar vacío para no cambiar)">
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('adminPassword')">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <button class="btn btn-gradient-kumo text-white px-4 py-2 rounded-pill mt-3" onclick="guardarUsuarioAdmin()">
                                <i class="bi bi-save me-1"></i> Guardar cambios
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/auth-service.js"></script>
    <script src="../js/carrito-service.js"></script>
    <script src="../js/perfil.js"></script>
    <script src="../js/footer.js"></script>
</body>

</html>
