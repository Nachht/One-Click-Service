<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos | Kumo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/img/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../estilos-css/contactenos.css">
    <link rel="stylesheet" href="../estilos-css/carrito.css">

</head>

<body>
    <script src="../js/navbar.js"></script>
    <main class="contacto">

        <div class="container">
            <div class="row g-4">

                <!-- COLUMNA IZQUIERDA: HEADER + INFO (col-lg-6) -->
                <aside class="col-xl-6 col-lg-5 contacto-info" aria-label="Información de contacto">

                    <!-- === BANNER / HEADER === -->
                    <div class="info-header">
                        <div class="info-title">
                            <h1 class="title-icon">Contáctanos</h1>
                        </div>
                        <p class="info-subtitle">
                            ¿Tienes dudas sobre tu pedido, algún producto o simplemente quieres saludar?
                        </p>
                        <div class="speed-lines">
                            <span></span><span></span><span></span><span></span>
                        </div>
                    </div>

                    <!-- === BOCADILLO MANGA === -->
                    <div class="manga-speech-bubble">
                        <p><strong>¡Escríbenos!</strong> Estamos listos para ayudarte.</p>
                    </div>

                    <!-- === DATOS DE CONTACTO === -->
                    <div class="info-items">
                        <div class="info-item">
                            <span class="info-icon"><i class="bi bi-envelope-paper-fill"></i></span>
                            <div>
                                <span class="info-label">Correo</span>
                                <strong>kumo@tiendaanime.com</strong>
                            </div>
                        </div>
                        <div class="info-item">
                            <span class="info-icon"><i class="bi bi-telephone-inbound-fill"></i></span>
                            <div>
                                <span class="info-label">Teléfono</span>
                                <strong>+57 300 123 4567</strong>
                            </div>
                        </div>
                        <div class="info-item">
                            <span class="info-icon"><i class="bi bi-geo-alt-fill"></i></span>
                            <div>
                                <span class="info-label">Ubicación</span>
                                <strong>Bogotá, Colombia</strong>
                            </div>
                        </div>
                        <div class="info-item">
                            <span class="info-icon"><i class="bi bi-clock-fill"></i></span>
                            <div>
                                <span class="info-label">Horario</span>
                                <strong>Lun - Vie de 9am - 6pm</strong>
                            </div>
                        </div>
                    </div>
                    <!-- PERSONAJE -->
                    <div class="contacto-personaje">
                        <img src="../assets/img/contactenos_perso.png" alt="Frieren" class="personaje-flotante">
                    </div>
                </aside>

                <!-- COLUMNA DERECHA: FORMULARIO (col-lg-7)     -->
                <section class="col-xl-6 col-lg-5 contacto-form" aria-label="Formulario de contacto">

                    <div class="formulario-card">
                        <form id="formularioContacto" novalidate>

                            <div class="campo-group">
                                <label for="nombre">Nombre completo</label>
                                <div class="grupoInput">
                                    <span class="iconoInput">
                                        <i class="bi bi-person-fill"></i>
                                    </span>
                                    <input type="text" id="nombre" name="nombre" placeholder="Escriba su nombre"
                                        autocomplete="name" required>
                                </div>
                                <small id="errorNombre"></small>
                            </div>

                            <!-- CORREO -->
                            <div class="campo-group">
                                <label for="correo">Correo electrónico</label>
                                <div class="grupoInput">
                                    <span class="iconoInput">
                                        <i class="bi bi-envelope-fill"></i>
                                    </span>
                                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com"
                                        autocomplete="email" required>
                                </div>
                                <small id="errorCorreo"></small>
                            </div>

                            <!-- TELÉFONO -->
                            <div class="campo-group">
                                <label for="telefono">Teléfono</label>
                                <div class="grupoInput">
                                    <span class="iconoInput">
                                        <i class="bi bi-telephone-fill"></i>
                                    </span>
                                    <input type="tel" id="telefono" name="telefono" placeholder="Escriba su teléfono"
                                        autocomplete="tel" required>
                                </div>
                                <small id="errorTelefono"></small>
                            </div>

                            <!-- ASUNTO -->
                            <div class="campo-group">
                                <label for="asunto">Asunto</label>
                                <div class="grupoInput">
                                    <span class="iconoInput">
                                        <i class="bi bi-tag-fill"></i>
                                    </span>
                                    <select id="asunto" name="asunto" required>
                                        <option value="">&emsp;Selecciona un motivo...</option>
                                        <option value="consulta">&emsp;Consulta sobre un producto</option>
                                        <option value="pedido">&emsp;Estado de mi pedido</option>
                                        <option value="devolucion">&emsp;Cambio o devolución</option>
                                        <option value="sugerencia">&emsp;Sugerencia de producto</option>
                                        <option value="colaboracion">&emsp;Colaboraciones</option>
                                        <option value="otro">&emsp;Otro</option>
                                    </select>
                                </div>
                                <small id="errorAsunto"></small>
                            </div>

                            <!-- MENSAJE -->
                            <div class="campo-group">
                                <label for="mensaje">Mensaje</label>
                                <div class="grupoInput">
                                    <span class="iconoInput">
                                        <i class="bi bi-chat-fill"></i>
                                    </span>
                                    <textarea id="mensaje" name="mensaje"
                                        placeholder="Cuéntanos en qué podemos ayudarte..." required></textarea>
                                </div>
                                <small id="errorMensaje"></small>
                            </div>
                            <!-- BOTÓN -->
                            <button type="submit" id="btnEnviar" class="manga-btn">
                                <span class="btn-text"> Enviar mensaje</span>
                                <span class="btn-effect"></span>
                            </button>

                            <!-- MENSAJE GENERAL -->
                            <p id="mensajeFormulario"></p>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script src="../js/api-config.js"></script>   
    <script src="../js/auth-service.js"></script>
    <script src="../js/carrito-service.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/contactenos.js"></script>
</body>

</html>
